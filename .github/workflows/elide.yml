name: Elide build

# Builds and tests the `elide` branch (upstream main + Elide's AWS-LC pin) and publishes, for
# `*-elide.*` tags: the provider jars (Maven Central classifier names, plus sources) and static JNI
# adapter archives per target triple, built with elide-dev/toolchain as ThinLTO bitcode.
on:
  push:
    branches: [elide]
    tags: ['*-elide.*']
  pull_request:
    branches: [elide]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: "Build (${{ matrix.classifier }})"
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - { classifier: linux-x86_64, runner: ubuntu-24.04 }
          - { classifier: linux-aarch_64, runner: ubuntu-24.04-arm }
          - { classifier: osx-aarch_64, runner: macos-15 }
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          submodules: true
          persist-credentials: false
      # JDK 21 exposes javax.crypto.KEM, which the ML-KEM Multi-Release overlay needs at build time.
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          java-version: '21'
          distribution: corretto
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: stable
          cache: false
      - name: Tools (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -qq -y --no-install-recommends cmake ninja-build
      - name: Tools (macOS)
        if: runner.os == 'macOS'
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
        run: brew install --quiet cmake ninja
      - name: Check AWS-LC pin
        run: |
          want="$(sed -n "s/^ext.awsLcMainTag = '\(.*\)'/\1/p" build.gradle)"
          have="$(git -C aws-lc describe --tags --exact-match 2>/dev/null || git -C aws-lc rev-parse HEAD)"
          echo "awsLcMainTag=$want submodule=$have"
          git -C aws-lc fetch -q --depth=1 origin "refs/tags/$want:refs/tags/$want"
          test "$(git -C aws-lc rev-parse HEAD)" = "$(git -C aws-lc rev-parse "$want^{commit}")"
      - name: Build and unit tests
        run: ./gradlew --no-daemon build unit_tests
      - name: Stage jar
        id: stage
        run: |
          v="$(sed -n "s/^version = '\(.*\)'/\1/p" build.gradle)"
          mkdir -p dist
          cp build/lib/AmazonCorrettoCryptoProvider.jar "dist/AmazonCorrettoCryptoProvider-$v-${{ matrix.classifier }}.jar"
          # The sources classifier carries csrc/, which Elide compiles into its static JNI adapter.
          if [ "${{ matrix.classifier }}" = linux-x86_64 ]; then
            ./gradlew --no-daemon src_jar
            cp build/lib/AmazonCorrettoCryptoProvider-sources.jar "dist/AmazonCorrettoCryptoProvider-$v-sources.jar"
            unzip -l "dist/AmazonCorrettoCryptoProvider-$v-sources.jar" | grep -c 'csrc/loader.cpp' >/dev/null
          fi
          ls -la dist
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: accp-${{ matrix.classifier }}
          path: dist/*.jar
          if-no-files-found: error

  static:
    name: "Static JNI (${{ matrix.bundle }})"
    needs: build
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - { bundle: linux-amd64, runner: ubuntu-24.04, triples: "x86_64-unknown-linux-gnu x86_64-unknown-linux-musl" }
          - { bundle: linux-arm64, runner: ubuntu-24.04-arm, triples: "aarch64-unknown-linux-gnu aarch64-unknown-linux-musl" }
          - { bundle: darwin-arm64, runner: macos-15, triples: "arm64-apple-darwin" }
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          java-version: '21'
          distribution: corretto
      # The sources classifier (generated Java + csrc/) from the linux-x86_64 build.
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: accp-linux-x86_64
          path: accp-jars
      - name: Toolchain bundle
        id: tc
        env:
          GH_TOKEN: ${{ github.token }}
          BUNDLE: ${{ matrix.bundle }}
        run: |
          . elide/toolchain.env
          if [ -n "$TOOLCHAIN_CI_RUN" ]; then
            gh run download "$TOOLCHAIN_CI_RUN" --repo elide-dev/toolchain -n "elide-toolchain-$BUNDLE" -D toolchain-dist
            a="$(ls "$PWD"/toolchain-dist/elide-toolchain-*-"$BUNDLE".tar.xz)"
            echo "archive=$a" >> "$GITHUB_OUTPUT"
          else
            echo "version=$TOOLCHAIN_VERSION" >> "$GITHUB_OUTPUT"
          fi
      # Same commit as TOOLCHAIN_ACTION_REF in elide/toolchain.env.
      - uses: elide-dev/toolchain/action@03ef2a7fe6d1d38fa3cbb0f6399ecdf136938a81
        with:
          version: ${{ steps.tc.outputs.version || 'latest' }}
          archive: ${{ steps.tc.outputs.archive }}
      - name: Build static archives
        env:
          TRIPLES: ${{ matrix.triples }}
        run: |
          v="$(sed -n "s/^version = '\(.*\)'/\1/p" build.gradle)"
          jar="$(ls accp-jars/AmazonCorrettoCryptoProvider-*-sources.jar)"
          mkdir -p dist
          for t in $TRIPLES; do
            elide/build-static.sh "$jar" "$t" "static/$t"
            cp LICENSE NOTICE "static/$t/"
            tar -C "static/$t" -czf "dist/AmazonCorrettoCryptoProvider-$v-static-$t.tar.gz" .
            cat "static/$t/BUILDINFO"
          done
          ls -la dist
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: accp-static-${{ matrix.bundle }}
          path: dist/*.tar.gz
          if-no-files-found: error

  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/')
    needs: [build, static]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          path: dist
          merge-multiple: true
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          cd dist
          for f in *.jar *.tar.gz; do sha256sum "$f" > "$f.sha256"; done
          ls -la
          gh release create "$TAG" ./* --repo "$GITHUB_REPOSITORY" --title "ACCP $TAG" \
            --notes "Upstream corretto/amazon-corretto-crypto-provider main with AWS-LC pinned to match Elide (aws-lc-sys) and elide-dev/toolchain. Built from $GITHUB_SHA."
